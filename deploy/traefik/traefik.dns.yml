# Traefik static config for SnikketX edge (production, DNS-01 ACME).
# Used instead of traefik.yml when deploy/acme-dns/docker-compose.acme-dns.yml
# is active. Certificates are issued through the Cloudflare DNS provider.
# CF_DNS_API_TOKEN must be set in .env.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: false

ping:
  entryPoint: web

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    transport:
      respondingTimeouts:
        readTimeout: 600s
  websecure:
    address: ":443"
    http3: {}
    http:
      aliasHeadersStrategy: delete
    transport:
      respondingTimeouts:
        readTimeout: 600s
        idleTimeout: 300s

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        propagation:
          delayBeforeChecks: 10
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

log:
  level: INFO

accessLog: {}
