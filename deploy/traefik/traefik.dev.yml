# Dev Traefik: plain HTTP on :8080, no ACME.

api:
  dashboard: false

ping:
  entryPoint: web

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

entryPoints:
  web:
    address: ":8080"
    http:
      aliasHeadersStrategy: delete
    transport:
      respondingTimeouts:
        readTimeout: 600s

log:
  level: INFO
