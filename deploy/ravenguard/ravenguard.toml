# RavenGuard as the HTTPS edge (no Traefik).
# Topology: Client -> RavenGuard (:80/:443 ACME) -> portal | Prosody | ACME webroot
# Docs: https://ravenguard.quad4.io/docs/deployment
#
# TLS-ALPN-01 issues RavenGuard HTTPS certs. HTTP-01 on :80 is left free so
# snikket_certs (certbot) can publish XMPP certs via acme_webroot.
# Challenge stays off: RavenGuard's PoW gate cannot run during XMPP WebSocket
# upgrades, and Prosody paths share this edge.

[listen]
http = ":80"
https = ":443"

[tls]
mode = "acme"

[tls.acme]
# email / hosts / agree_tos come from RG_ACME_* env in compose
staging = false
storage_dir = "/data/certs"
http01 = false
tls_alpn01 = true
redirect_http = true

[upstream]
url = "http://snikket_portal:5765"
connect_timeout = "5s"
# BOSH long-polls can hold a request open up to the negotiated wait window
response_header_timeout = "90s"
idle_conn_timeout = "90s"
max_idle_conns = 256

[upstream.health]
enabled = true
path = "/_health"
interval = "10s"
timeout = "3s"

[trust]
mode = "edge"

[blocklists]
ip_files = ["/blocklists/ips.txt"]
dns_files = ["/blocklists/domains.txt"]
ua_files = ["/blocklists/ua.txt"]
reload_interval = "30s"

[allowlists]
reload_interval = "30s"

[ratelimit]
enabled = true
requests = 120
window = "1m"
burst = 60
per_path = false
challenge_over = false

[protect]
enabled = true
max_body_bytes = 10485760
max_header_bytes = 16384
max_url_bytes = 8192
max_concurrent_global = 2048
max_concurrent_per_client = 16
ban_after_strikes = 5
ban_ttl = "10m"
attack_block = true
attack_score = 90
write_method_cost = 3

[detect]
enabled = true
challenge_score = 40
block_score = 90

[challenge]
enabled = false
mode = "detect"
algorithm = "adaptive"
difficulty = 16
env_probe = "on"
cookie_name = "rg_clear"
cookie_ttl = "24h"
secret = "rg-change-me-please!!"
path_prefix = "/_rg"

[ui]
brand = "SnikketX"
status_text = "Checking your browser before accessing this site."
test_mode = false

[site]
description = "SnikketX"
theme_color = "#050505"
robots = "noindex, nofollow"
lang = "en"

[privacy]
hash_client_ip = true
log_ip = "hash"
retention = "30m"

[logging]
level = "info"
format = "text"
stats = true
stats_interval = "30s"

[sandbox]
mode = "best_effort"

[sandbox.landlock]
restrict_net = true
restrict_scoped = true
ignore_missing = true
connect_tcp = [53, 80, 443, 5280, 5765, 8080]

[admin]
enabled = true
listen = "0.0.0.0:9090"
base_path = "/"
data_dir = "/data/admin"
bootstrap_user = "admin"
session_ttl = "12h"
cookie_secure = "auto"
