# Local development stack.
# Builds portal + server from this tree. Does not pull snikketx GHCR images.
#
#   ./scripts/start.sh --dev

services:
  ravenguard:
    ports: !override
      - "8080:8080"
    volumes: !override
      - ./deploy/ravenguard/ravenguard.dev.toml:/config/ravenguard.toml:ro
      - ./deploy/ravenguard/blocklists:/blocklists:ro
      - ravenguard_data:/data
    environment: !override
      RG_CHALLENGE_SECRET: rg-dev-local-secret!!
      RG_CHALLENGE_ENABLED: "false"
      RG_TLS_MODE: "off"
      RG_TRUST_MODE: edge
      RG_SANDBOX_MODE: best_effort
      RG_UPSTREAM_URL: http://snikket_portal:5765
      RG_ADMIN_ENABLED: "true"
      RG_ADMIN_LISTEN: 0.0.0.0:9090
      RG_ADMIN_DATA_DIR: /data/admin
      RG_ADMIN_BOOTSTRAP_USER: admin
      RG_ADMIN_BOOTSTRAP_PASSWORD: ${RG_ADMIN_BOOTSTRAP_PASSWORD:-rg-dev-admin-password!!}
    cap_add: !override
      - NET_BIND_SERVICE
    depends_on:
      bootstrap_ravenguard:
        condition: service_completed_successfully
      snikket_portal:
        condition: service_started

  acme_webroot:
    profiles: ["prod-only"]

  snikket_certs:
    profiles: ["prod-only"]

  bootstrap_ravenguard:
    image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: snikketx-bootstrap-ravenguard
    security_opt:
      - no-new-privileges:true
    volumes:
      - ravenguard_data:/data
    networks:
      - snikketx
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /data/admin /data/certs
        chown -R 65532:65532 /data
        echo "ravenguard data owned by 65532"

  bootstrap_certs:
    image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: snikketx-bootstrap-certs
    env_file: snikket.conf
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - snikket_data:/snikket
    networks:
      - snikketx
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache openssl >/dev/null
        d="$${SNIKKET_DOMAIN:?SNIKKET_DOMAIN required}"
        live="/snikket/letsencrypt/live/$${d}"
        if [ -f "$${live}/fullchain.pem" ] && [ -f "$${live}/privkey.pem" ]; then
          echo "dev certs already present for $${d}"
          exit 0
        fi
        mkdir -p "$${live}"
        openssl req -x509 -newkey rsa:2048 -nodes \
          -keyout "$${live}/privkey.pem" \
          -out "$${live}/fullchain.pem" \
          -days 365 \
          -subj "/CN=$${d}"
        cp "$${live}/fullchain.pem" "$${live}/cert.pem"
        cp "$${live}/fullchain.pem" "$${live}/chain.pem"
        echo "wrote self-signed certs under $${live}"

  snikket_updater:
    image: snikketx/updater:dev
    pull_policy: build
    build:
      context: ./updater
      dockerfile: Dockerfile
    environment:
      SNIKKET_UPDATER_TOKEN: ${SNIKKET_UPDATER_TOKEN:-snikket-updater-local}
      SNIKKET_UPDATER_COMPOSE_DIR: /work
      SNIKKET_UPDATER_STATE_DIR: /var/lib/snikket-updater
      SNIKKET_UPDATER_LISTEN: 0.0.0.0:9191
      SNIKKET_UPDATER_IMAGE_PREFIX: ${SNIKKET_UPDATER_IMAGE_PREFIX:-ghcr.io/sudo-ivan/snikketx}
      SNIKKET_UPDATER_VERIFY_SIGNATURES: ${SNIKKET_UPDATER_VERIFY_SIGNATURES:-true}
      # Local :dev tags are unsigned, so require stays off in dev.
      SNIKKET_UPDATER_REQUIRE_SIGNATURES: "false"
      SNIKKET_UPDATER_COSIGN_IDENTITY_REGEXP: ${SNIKKET_UPDATER_COSIGN_IDENTITY_REGEXP:-https://github.com/Sudo-Ivan/snikketx/.*}
      SNIKKET_UPDATER_COSIGN_OIDC_ISSUER: ${SNIKKET_UPDATER_COSIGN_OIDC_ISSUER:-https://token.actions.githubusercontent.com}

  snikket_backup:
    image: snikketx/backup:dev
    pull_policy: build
    build:
      context: ./backup
      dockerfile: Dockerfile
    environment:
      SNIKKET_BACKUP_TOKEN: ${SNIKKET_BACKUP_TOKEN:-snikket-backup-local}
      SNIKKET_BACKUP_COMPOSE_DIR: /work
      SNIKKET_BACKUP_STATE_DIR: /var/lib/snikket-backup
      SNIKKET_BACKUP_ARCHIVE_DIR: /var/lib/snikket-backup/archives
      SNIKKET_BACKUP_LISTEN: 0.0.0.0:9292
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_PASSWORD_FILE: ${RESTIC_PASSWORD_FILE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/work:ro
      - backup_data:/var/lib/snikket-backup
    ports:
      - "127.0.0.1:9292:9292"

  snikket_portal:
    image: snikketx/web-portal:dev
    pull_policy: build
    build:
      context: ./web-portal
      dockerfile: Dockerfile
      args:
        BUILD_SERIES: dev
        BUILD_ID: local
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    user: "10001:10001"
    environment:
      SNIKKET_WEB_INSECURE_COOKIES: "true"
      SNIKKET_WEB_UPDATER_ENDPOINT: http://snikket_updater:9191
      SNIKKET_WEB_UPDATER_TOKEN: ${SNIKKET_UPDATER_TOKEN:-snikket-updater-local}
      SNIKKET_WEB_BACKUP_ENDPOINT: http://snikket_backup:9292
      SNIKKET_WEB_BACKUP_TOKEN: ${SNIKKET_BACKUP_TOKEN:-snikket-backup-local}
    volumes:
      - portal_data:/var/lib/snikket-web-portal

  snikket_server:
    image: snikketx/server:dev
    pull_policy: build
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        BUILD_SERIES: dev
        BUILD_ID: local
    depends_on:
      bootstrap_certs:
        condition: service_completed_successfully
