name: snikketx

networks:
  snikketx:
    name: snikketx
    driver: bridge

volumes:
  snikket_data:
  acme_challenges:
  ravenguard_data:
  portal_data:
  updater_data:
  backup_data:

# Shared service fragments applied below via YAML merge keys.
x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - snikketx

x-cap-drop: &cap-drop
  cap_drop:
    - ALL

x-read-only: &read-only
  read_only: true

x-env-file: &env-file
  env_file:
    - snikket.conf

x-tmpfs: &tmpfs
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  ravenguard:
    <<: [*defaults, *cap-drop, *read-only, *tmpfs]
    image: ghcr.io/quad4-software/ravenguard:edge@sha256:36e9df0c1812cb015443d6e5690e6e487b73ee02e281e83b6036d5475ecf0365
    container_name: snikketx-ravenguard
    user: "65532:65532"
    cap_add:
      - NET_BIND_SERVICE
    env_file:
      - .env
      - snikket.conf
    environment:
      RG_CHALLENGE_SECRET: ${RG_CHALLENGE_SECRET}
      RG_TLS_MODE: acme
      RG_ACME_EMAIL: ${SNIKKET_ADMIN_EMAIL}
      RG_ACME_AGREE_TOS: "true"
      RG_ACME_HOSTS: ${SNIKKET_DOMAIN},share.${SNIKKET_DOMAIN},groups.${SNIKKET_DOMAIN}
      RG_ACME_STORAGE_DIR: /data/certs
      RG_TRUST_MODE: edge
      RG_SANDBOX_MODE: best_effort
      RG_UPSTREAM_URL: http://snikket_portal:5765
      RG_ADMIN_ENABLED: "true"
      RG_ADMIN_LISTEN: 0.0.0.0:9090
      RG_ADMIN_DATA_DIR: /data/admin
      RG_ADMIN_BOOTSTRAP_USER: admin
      RG_ADMIN_BOOTSTRAP_PASSWORD: ${RG_ADMIN_BOOTSTRAP_PASSWORD}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/ravenguard/ravenguard.toml:/config/ravenguard.toml:ro
      - ./deploy/ravenguard/blocklists:/blocklists:ro
      - ravenguard_data:/data
    command: ["-config", "/config/ravenguard.toml"]
    depends_on:
      bootstrap_ravenguard:
        condition: service_completed_successfully
      snikket_portal:
        condition: service_started

  bootstrap_ravenguard:
    <<: *defaults
    image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: snikketx-bootstrap-ravenguard
    restart: "no"
    volumes:
      - ravenguard_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /data/admin /data/certs
        chown -R 65532:65532 /data
        echo "ravenguard data owned by 65532"

  acme_webroot:
    <<: [*defaults, *cap-drop, *read-only]
    image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: snikketx-acme-webroot
    user: "65534:65534"
    tmpfs:
      - /tmp:size=8m,mode=1777
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    volumes:
      - acme_challenges:/www/.well-known/acme-challenge:ro

  snikket_certs:
    <<: [*defaults, *cap-drop, *env-file]
    image: ghcr.io/sudo-ivan/snikketx/cert-manager:${SNIKKETX_IMAGE_TAG:-latest}
    container_name: snikket-certs
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    volumes:
      - snikket_data:/snikket
      - acme_challenges:/var/www/.well-known/acme-challenge

  snikket_portal:
    <<: [*defaults, *cap-drop, *read-only, *tmpfs, *env-file]
    image: ghcr.io/sudo-ivan/snikketx/web-portal:${SNIKKETX_IMAGE_TAG:-latest}
    container_name: snikket-portal
    user: "10001:10001"
    environment:
      SNIKKET_TWEAK_PORTAL_INTERNAL_HTTP_INTERFACE: "0.0.0.0"
      SNIKKET_TWEAK_PORTAL_INTERNAL_HTTP_PORT: "5765"
      SNIKKET_WEB_PROSODY_ENDPOINT: http://snikket_server:5280/
      SNIKKET_WEB_UPDATER_ENDPOINT: ${SNIKKET_WEB_UPDATER_ENDPOINT:-http://snikket_updater:9191}
      SNIKKET_WEB_UPDATER_TOKEN: ${SNIKKET_UPDATER_TOKEN:-snikket-updater-local}
      SNIKKET_WEB_BACKUP_ENDPOINT: ${SNIKKET_WEB_BACKUP_ENDPOINT:-http://snikket_backup:9292}
      SNIKKET_WEB_BACKUP_TOKEN: ${SNIKKET_BACKUP_TOKEN:-snikket-backup-local}
    volumes:
      - portal_data:/var/lib/snikket-web-portal
    depends_on:
      - snikket_server
    expose:
      - "5765"

  snikket_server:
    <<: [*defaults, *cap-drop, *env-file]
    image: ghcr.io/sudo-ivan/snikketx/server:${SNIKKETX_IMAGE_TAG:-latest}
    container_name: snikket
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    environment:
      SNIKKET_TWEAK_INTERNAL_HTTP_INTERFACE: "0.0.0.0"
      SNIKKET_TWEAK_INTERNAL_HTTP_PORT: "5280"
    volumes:
      - snikket_data:/snikket
    ports:
      - "5222:5222"
      - "5269:5269"
      - "5000:5000"
      - "3478:3478"
      - "3478:3478/udp"
      - "3479:3479"
      - "3479:3479/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "5350:5350"
      - "5350:5350/udp"
    expose:
      - "5280"

  snikket_updater:
    <<: [*defaults, *env-file]
    image: ghcr.io/sudo-ivan/snikketx/updater:${SNIKKETX_IMAGE_TAG:-latest}
    container_name: snikket-updater
    environment:
      SNIKKET_UPDATER_TOKEN: ${SNIKKET_UPDATER_TOKEN:-snikket-updater-local}
      SNIKKET_UPDATER_COMPOSE_DIR: /work
      SNIKKET_UPDATER_STATE_DIR: /var/lib/snikket-updater
      SNIKKET_UPDATER_LISTEN: 0.0.0.0:9191
      SNIKKET_UPDATER_IMAGE_PREFIX: ${SNIKKET_UPDATER_IMAGE_PREFIX:-ghcr.io/sudo-ivan/snikketx}
      SNIKKET_UPDATER_VERIFY_SIGNATURES: ${SNIKKET_UPDATER_VERIFY_SIGNATURES:-true}
      SNIKKET_UPDATER_REQUIRE_SIGNATURES: ${SNIKKET_UPDATER_REQUIRE_SIGNATURES:-true}
      SNIKKET_UPDATER_COSIGN_IDENTITY_REGEXP: ${SNIKKET_UPDATER_COSIGN_IDENTITY_REGEXP:-https://github.com/Sudo-Ivan/snikketx/.*}
      SNIKKET_UPDATER_COSIGN_OIDC_ISSUER: ${SNIKKET_UPDATER_COSIGN_OIDC_ISSUER:-https://token.actions.githubusercontent.com}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/work:ro
      - updater_data:/var/lib/snikket-updater
    expose:
      - "9191"

  snikket_backup:
    <<: [*defaults, *env-file]
    image: ghcr.io/sudo-ivan/snikketx/backup:${SNIKKETX_IMAGE_TAG:-latest}
    container_name: snikket-backup
    environment:
      SNIKKET_BACKUP_TOKEN: ${SNIKKET_BACKUP_TOKEN:-snikket-backup-local}
      SNIKKET_BACKUP_COMPOSE_DIR: /work
      SNIKKET_BACKUP_STATE_DIR: /var/lib/snikket-backup
      SNIKKET_BACKUP_ARCHIVE_DIR: /var/lib/snikket-backup/archives
      SNIKKET_BACKUP_LISTEN: 0.0.0.0:9292
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_PASSWORD_FILE: ${RESTIC_PASSWORD_FILE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/work:ro
      - backup_data:/var/lib/snikket-backup
    ports:
      - "127.0.0.1:9292:9292"
    expose:
      - "9292"
