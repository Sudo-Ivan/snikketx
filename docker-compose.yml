name: snikketx

networks:
  snikketx:
    name: snikketx
    driver: bridge

volumes:
  snikket_data:
  acme_challenges:
  traefik_data:
  portal_data:
  updater_data:
  backup_data:

# Shared service fragments applied below via YAML merge keys.
x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - snikketx

x-cap-drop: &cap-drop
  cap_drop:
    - ALL

x-read-only: &read-only
  read_only: true

x-env-file: &env-file
  env_file:
    - snikket.conf

x-tmpfs: &tmpfs
  tmpfs:
    - /tmp:size=64m,mode=1777

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  traefik:
    <<: [*defaults, *cap-drop, *read-only, *tmpfs]
    image: docker.io/library/traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    container_name: snikketx-traefik
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${SNIKKET_ADMIN_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      # UDP 443 carries QUIC when the http3 entryPoint option is on.
      - "443:443/udp"
    volumes:
      - ./deploy/traefik:/etc/traefik:ro
      - traefik_data:/data
    depends_on:
      bootstrap_traefik:
        condition: service_completed_successfully
      snikket_portal:
        condition: service_started

  bootstrap_traefik:
    <<: *defaults
    image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: snikketx-bootstrap-traefik
    restart: "no"
    volumes:
      - traefik_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # Traefik skips the ACME resolver when acme.json is missing.
        touch /data/acme.json
        chmod 600 /data/acme.json
        echo "acme.json ready"

  acme_webroot:
    <<: [*defaults, *cap-drop, *read-only]
    image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: snikketx-acme-webroot
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pgrep httpd >/dev/null"]
    user: "65534:65534"
    tmpfs:
      - /tmp:size=8m,mode=1777
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    volumes:
      - acme_challenges:/www/.well-known/acme-challenge:ro

  snikket_certs:
    <<: [*defaults, *cap-drop, *env-file]
    image: ghcr.io/sudo-ivan/snikketx/cert-manager:${SNIKKETX_IMAGE_TAG:-latest}
    container_name: snikket-certs
    environment:
      # Only used by scripts/enable-dns-acme.sh installs. Empty keeps
      # certbot on the default HTTP-01 webroot challenge.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "test ! -f /snikket/letsencrypt/has-errors"]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    volumes:
      - snikket_data:/snikket
      - acme_challenges:/var/www/.well-known/acme-challenge

  snikket_portal:
    <<: [*defaults, *cap-drop, *read-only, *tmpfs, *env-file]
    image: ghcr.io/sudo-ivan/snikketx/web-portal:${SNIKKETX_IMAGE_TAG:-latest}
    container_name: snikket-portal
    user: "10001:10001"
    environment:
      SNIKKET_TWEAK_PORTAL_INTERNAL_HTTP_INTERFACE: "0.0.0.0"
      SNIKKET_TWEAK_PORTAL_INTERNAL_HTTP_PORT: "5765"
      SNIKKET_WEB_PROSODY_ENDPOINT: http://snikket_server:5280/
      SNIKKET_WEB_UPDATER_ENDPOINT: ${SNIKKET_WEB_UPDATER_ENDPOINT:-http://snikket_updater:9191}
      SNIKKET_WEB_UPDATER_TOKEN: ${SNIKKET_UPDATER_TOKEN:-snikket-updater-local}
      SNIKKET_WEB_BACKUP_ENDPOINT: ${SNIKKET_WEB_BACKUP_ENDPOINT:-http://snikket_backup:9292}
      SNIKKET_WEB_BACKUP_TOKEN: ${SNIKKET_BACKUP_TOKEN:-snikket-backup-local}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/portal", "-healthcheck"]
    volumes:
      - portal_data:/var/lib/snikket-web-portal
    depends_on:
      - snikket_server
    expose:
      - "5765"

  snikket_server:
    <<: [*defaults, *cap-drop, *env-file]
    image: ghcr.io/sudo-ivan/snikketx/server:${SNIKKETX_IMAGE_TAG:-latest}
    container_name: snikket
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    environment:
      SNIKKET_TWEAK_INTERNAL_HTTP_INTERFACE: "0.0.0.0"
      SNIKKET_TWEAK_INTERNAL_HTTP_PORT: "5280"
      SNIKKET_TWEAK_TURNSERVER_MIN_PORT: ${SNIKKET_TURN_MIN_PORT:-49152}
      SNIKKET_TWEAK_TURNSERVER_MAX_PORT: ${SNIKKET_TURN_MAX_PORT:-49251}
    healthcheck:
      <<: *healthcheck
      start_period: 60s
      test: ["CMD-SHELL", "prosodyctl status >/dev/null 2>&1"]
    volumes:
      - snikket_data:/snikket
    ports:
      - "5222:5222"
      - "5223:5223"
      - "5269:5269"
      - "5000:5000"
      - "3478:3478"
      - "3478:3478/udp"
      - "3479:3479"
      - "3479:3479/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "5350:5350"
      - "5350:5350/udp"
      # TURN relay candidates need their UDP range reachable for calls.
      # Keep the range in sync with SNIKKET_TWEAK_TURNSERVER_MIN/MAX_PORT.
      - "${SNIKKET_TURN_MIN_PORT:-49152}-${SNIKKET_TURN_MAX_PORT:-49251}:${SNIKKET_TURN_MIN_PORT:-49152}-${SNIKKET_TURN_MAX_PORT:-49251}/udp"
    expose:
      - "5280"

  snikket_updater:
    <<: [*defaults, *env-file]
    image: ghcr.io/sudo-ivan/snikketx/updater:${SNIKKETX_IMAGE_TAG:-latest}
    container_name: snikket-updater
    environment:
      SNIKKET_UPDATER_TOKEN: ${SNIKKET_UPDATER_TOKEN:-snikket-updater-local}
      SNIKKET_UPDATER_COMPOSE_DIR: /work
      SNIKKET_UPDATER_STATE_DIR: /var/lib/snikket-updater
      SNIKKET_UPDATER_LISTEN: 0.0.0.0:9191
      SNIKKET_UPDATER_IMAGE_PREFIX: ${SNIKKET_UPDATER_IMAGE_PREFIX:-ghcr.io/sudo-ivan/snikketx}
      SNIKKET_UPDATER_VERIFY_SIGNATURES: ${SNIKKET_UPDATER_VERIFY_SIGNATURES:-true}
      SNIKKET_UPDATER_REQUIRE_SIGNATURES: ${SNIKKET_UPDATER_REQUIRE_SIGNATURES:-true}
      SNIKKET_UPDATER_COSIGN_IDENTITY_REGEXP: ${SNIKKET_UPDATER_COSIGN_IDENTITY_REGEXP:-https://github.com/Sudo-Ivan/snikketx/.*}
      SNIKKET_UPDATER_COSIGN_OIDC_ISSUER: ${SNIKKET_UPDATER_COSIGN_OIDC_ISSUER:-https://token.actions.githubusercontent.com}
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9191/healthz"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/work:ro
      - updater_data:/var/lib/snikket-updater
    expose:
      - "9191"

  snikket_backup:
    <<: [*defaults, *env-file]
    image: ghcr.io/sudo-ivan/snikketx/backup:${SNIKKETX_IMAGE_TAG:-latest}
    container_name: snikket-backup
    environment:
      SNIKKET_BACKUP_TOKEN: ${SNIKKET_BACKUP_TOKEN:-snikket-backup-local}
      SNIKKET_BACKUP_COMPOSE_DIR: /work
      SNIKKET_BACKUP_STATE_DIR: /var/lib/snikket-backup
      SNIKKET_BACKUP_ARCHIVE_DIR: /var/lib/snikket-backup/archives
      SNIKKET_BACKUP_LISTEN: 0.0.0.0:9292
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      RESTIC_PASSWORD_FILE: ${RESTIC_PASSWORD_FILE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9292/healthz"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/work:ro
      - backup_data:/var/lib/snikket-backup
    ports:
      - "127.0.0.1:9292:9292"
    expose:
      - "9292"
