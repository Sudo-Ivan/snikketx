name: snikketx

networks:
  snikketx:
    name: snikketx
    driver: bridge

volumes:
  snikket_data:
  acme_challenges:
  ravenguard_data:
  portal_data:
  updater_data:

services:
  ravenguard:
    image: ghcr.io/quad4-software/ravenguard:edge@sha256:36e9df0c1812cb015443d6e5690e6e487b73ee02e281e83b6036d5475ecf0365
    container_name: snikketx-ravenguard
    restart: unless-stopped
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file:
      - .env
      - snikket.conf
    environment:
      RG_CHALLENGE_SECRET: ${RG_CHALLENGE_SECRET}
      RG_TLS_MODE: acme
      RG_ACME_EMAIL: ${SNIKKET_ADMIN_EMAIL}
      RG_ACME_AGREE_TOS: "true"
      RG_ACME_HOSTS: ${SNIKKET_DOMAIN},share.${SNIKKET_DOMAIN},groups.${SNIKKET_DOMAIN}
      RG_ACME_STORAGE_DIR: /data/certs
      RG_TRUST_MODE: edge
      RG_SANDBOX_MODE: best_effort
      RG_UPSTREAM_URL: http://snikket_portal:5765
      RG_ADMIN_ENABLED: "true"
      RG_ADMIN_LISTEN: 0.0.0.0:9090
      RG_ADMIN_DATA_DIR: /data/admin
      RG_ADMIN_BOOTSTRAP_USER: admin
      RG_ADMIN_BOOTSTRAP_PASSWORD: ${RG_ADMIN_BOOTSTRAP_PASSWORD}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/ravenguard/ravenguard.toml:/config/ravenguard.toml:ro
      - ./deploy/ravenguard/blocklists:/blocklists:ro
      - ravenguard_data:/data
    command: ["-config", "/config/ravenguard.toml"]
    networks:
      - snikketx
    depends_on:
      bootstrap_ravenguard:
        condition: service_completed_successfully
      snikket_portal:
        condition: service_started

  bootstrap_ravenguard:
    image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: snikketx-bootstrap-ravenguard
    security_opt:
      - no-new-privileges:true
    volumes:
      - ravenguard_data:/data
    networks:
      - snikketx
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /data/admin /data/certs
        chown -R 65532:65532 /data
        echo "ravenguard data owned by 65532"

  acme_webroot:
    image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: snikketx-acme-webroot
    restart: unless-stopped
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    volumes:
      - acme_challenges:/www/.well-known/acme-challenge:ro
    networks:
      - snikketx

  snikket_certs:
    image: ghcr.io/sudo-ivan/snikketx/cert-manager:latest
    container_name: snikket-certs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    env_file: snikket.conf
    volumes:
      - snikket_data:/snikket
      - acme_challenges:/var/www/.well-known/acme-challenge
    networks:
      - snikketx

  snikket_portal:
    image: ghcr.io/sudo-ivan/snikketx/web-portal:latest
    container_name: snikket-portal
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file: snikket.conf
    environment:
      SNIKKET_TWEAK_PORTAL_INTERNAL_HTTP_INTERFACE: "0.0.0.0"
      SNIKKET_TWEAK_PORTAL_INTERNAL_HTTP_PORT: "5765"
      SNIKKET_WEB_PROSODY_ENDPOINT: http://snikket_server:5280/
      SNIKKET_WEB_UPDATER_ENDPOINT: http://snikket_updater:9191
      SNIKKET_WEB_UPDATER_TOKEN: ${SNIKKET_UPDATER_TOKEN}
    volumes:
      - portal_data:/var/lib/snikket-web-portal
    networks:
      - snikketx
    depends_on:
      - snikket_server
    expose:
      - "5765"

  snikket_server:
    image: ghcr.io/sudo-ivan/snikketx/server:latest
    container_name: snikket
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    env_file: snikket.conf
    environment:
      SNIKKET_TWEAK_INTERNAL_HTTP_INTERFACE: "0.0.0.0"
      SNIKKET_TWEAK_INTERNAL_HTTP_PORT: "5280"
    volumes:
      - snikket_data:/snikket
    ports:
      - "5222:5222"
      - "5269:5269"
      - "5000:5000"
      - "3478:3478"
      - "3478:3478/udp"
      - "3479:3479"
      - "3479:3479/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "5350:5350"
      - "5350:5350/udp"
    networks:
      - snikketx
    expose:
      - "5280"

  snikket_updater:
    profiles: ["updater"]
    image: ghcr.io/sudo-ivan/snikketx/updater:latest
    container_name: snikket-updater
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: snikket.conf
    environment:
      SNIKKET_UPDATER_TOKEN: ${SNIKKET_UPDATER_TOKEN}
      SNIKKET_UPDATER_COMPOSE_DIR: /work
      SNIKKET_UPDATER_STATE_DIR: /var/lib/snikket-updater
      SNIKKET_UPDATER_LISTEN: 0.0.0.0:9191
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/work:ro
      - updater_data:/var/lib/snikket-updater
    networks:
      - snikketx
    expose:
      - "9191"
