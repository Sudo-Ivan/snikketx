{{define "content"}}
<section class="card card-narrow">
	<h1>Sign out</h1>
	<p class="muted">Signing out ends this portal session and revokes its access token. Your chat app stays signed in.</p>
	<form method="post" action="/user/logout" class="form">
		{{csrf .CSRF}}
		<div class="actions">
			<button type="submit" class="btn btn-danger">{{template "icon" "log-out"}}<span>Sign out</span></button>
			<a class="btn btn-ghost" href="/user/">Stay signed in</a>
		</div>
	</form>
</section>
{{end}}
