{{define "content"}}
<p><a class="btn btn-ghost btn-small" href="/admin/circles">{{template "icon" "arrow-left"}}<span>All circles</span></a></p>

<section class="card card-narrow">
	<h1>New circle</h1>
	<p class="muted">Give the circle a name your members will recognise, such as a family name, a team or a club.</p>
	<form method="post" action="/admin/circle/-/new" class="form">
		{{csrf .CSRF}}
		<div class="field">
			<label for="name">Name</label>
			<input type="text" id="name" name="name" maxlength="120" required autofocus>
		</div>
		<label class="choice">
			<input type="checkbox" name="create_muc" value="1">
			<span><strong>Create a group chat too</strong><span class="hint">Every member of the circle joins the chat automatically.</span></span>
		</label>
		<div class="actions">
			<button type="submit" class="btn btn-primary">{{template "icon" "check"}}<span>Create circle</span></button>
			<a class="btn btn-ghost" href="/admin/circles">Cancel</a>
		</div>
	</form>
</section>
{{end}}
