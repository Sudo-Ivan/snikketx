{{define "content"}}
<section class="card card-narrow">
	<h1>This invitation is no longer valid</h1>
	<p class="lede">The link you followed has expired, was already used, or was revoked.</p>
	<p class="muted">Ask the person who invited you to {{.SiteName}} for a fresh invitation link.</p>
	<p><a class="btn btn-ghost" href="/">{{template "icon" "arrow-left"}}<span>Go to {{.SiteName}}</span></a></p>
</section>
{{end}}
