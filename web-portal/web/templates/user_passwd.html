{{define "content"}}
<section class="card card-narrow">
	<h1>Change your password</h1>
	<p class="muted">Your new password must be at least 10 characters long. Every device stays signed in, only this portal session is refreshed.</p>
	<form method="post" action="/user/passwd" class="form">
		{{csrf .CSRF}}
		<div class="field">
			<label for="current_password">Current password</label>
			<input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
		</div>
		<div class="field">
			<label for="new_password">New password</label>
			<input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="10" required>
		</div>
		<div class="field">
			<label for="new_password_confirm">Confirm new password</label>
			<input type="password" id="new_password_confirm" name="new_password_confirm" autocomplete="new-password" minlength="10" required>
		</div>
		<div class="actions">
			<button type="submit" class="btn btn-primary">{{template "icon" "key"}}<span>Change password</span></button>
			<a class="btn btn-ghost" href="/user/">Cancel</a>
		</div>
	</form>
</section>
{{end}}
