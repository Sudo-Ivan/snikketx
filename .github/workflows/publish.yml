name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    name: "publish ${{ matrix.component }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: ./server
            title: snikketx-server
            description: SnikketX Prosody server image
            licenses: Apache-2.0
          - component: web-portal
            context: ./web-portal
            title: snikketx-web-portal
            description: SnikketX web portal
            licenses: AGPL-3.0-or-later
          - component: web-proxy
            context: ./web-proxy
            title: snikketx-web-proxy
            description: Legacy SnikketX nginx proxy
            licenses: Apache-2.0
          - component: cert-manager
            context: ./cert-manager
            title: snikketx-cert-manager
            description: SnikketX Let's Encrypt helper
            licenses: Apache-2.0
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/sudo-ivan/snikketx/${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
            org.opencontainers.image.vendor=Sudo-Ivan

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SERIES=${{ github.ref_type == 'tag' && 'stable' || 'dev' }}
            BUILD_ID=${{ github.run_number }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: true
          sbom: true

      - name: Record image digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST='${{ steps.build.outputs.digest }}'
          IMAGE="ghcr.io/sudo-ivan/snikketx/${{ matrix.component }}"
          REF="${IMAGE}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          {
            echo "## ${{ matrix.component }}"
            echo ""
            echo "\`\`\`"
            echo "${REF}"
            echo "\`\`\`"
            echo ""
            echo "Verify signature:"
            echo ""
            echo "\`\`\`"
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp='https://github.com/Sudo-Ivan/snikketx/.*' \\"
            echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com \\"
            echo "  ${REF}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${REF}" > "digest-${{ matrix.component }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: digest-${{ matrix.component }}
          path: digest-${{ matrix.component }}.txt
          if-no-files-found: error

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: ${{ steps.digest.outputs.ref }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.component }}.spdx.json
          output-file: sbom-${{ matrix.component }}.spdx.json

      - name: Cosign keyless sign
        env:
          DIGEST_REF: ${{ steps.digest.outputs.ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "${DIGEST_REF}"

      - name: Cosign attach SBOM
        env:
          DIGEST_REF: ${{ steps.digest.outputs.ref }}
        run: |
          set -euo pipefail
          cosign attach sbom --sbom "sbom-${{ matrix.component }}.spdx.json" "${DIGEST_REF}"

      - name: Cosign keyless attest SBOM
        continue-on-error: true
        env:
          DIGEST_REF: ${{ steps.digest.outputs.ref }}
        run: |
          set -euo pipefail
          cosign attest --yes --predicate "sbom-${{ matrix.component }}.spdx.json" --type spdxjson "${DIGEST_REF}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digest.outputs.ref }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.sarif
          if-no-files-found: ignore

      - name: Upload Trivy results to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/snikketx%2F${{ matrix.component }}/visibility" \
            -f visibility=public || true
